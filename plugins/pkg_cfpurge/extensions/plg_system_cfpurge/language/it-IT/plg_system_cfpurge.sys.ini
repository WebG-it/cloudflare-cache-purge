PLG_SYSTEM_CFPURGE="Sistema - Cloudflare Cache Purge"
PLG_SYSTEM_CFPURGE_XML_DESCRIPTION="Parte del pacchetto Cloudflare Cache Purge. Ascolta gli eventi che i plugin di contenuto non possono sentire (salvataggio o cancellazione di un modulo del sito, Sistema > Svuota cache) e li passa al plugin Contenuto - Cloudflare Cache Purge. Non ha opzioni: tutto si imposta nel plugin di contenuto, e non fa nulla finché quel plugin è spento."

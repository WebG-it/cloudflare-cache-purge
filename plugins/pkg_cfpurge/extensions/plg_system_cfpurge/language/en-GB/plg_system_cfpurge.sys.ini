PLG_SYSTEM_CFPURGE="System - Cloudflare Cache Purge"
PLG_SYSTEM_CFPURGE_XML_DESCRIPTION="Part of the Cloudflare Cache Purge package. Listens to the events that content plugins cannot hear (saving or deleting a site module, System > Clear Cache) and passes them to the Content - Cloudflare Cache Purge plugin. It has no options: everything is set in the content plugin, and it does nothing while that plugin is off."

PLG_CONTENT_CFPURGE="Contenuto - Cloudflare Cache Purge"
PLG_CONTENT_CFPURGE_XML_DESCRIPTION="Svuota la cache di Cloudflare quando cambia il sito pubblico: articoli, categorie, voci di menu, moduli, campi personalizzati e tag (facoltativamente anche Sistema > Svuota cache). Tutta la cache oppure solo gli indirizzi cambiati. Include una configurazione guidata con la verifica della connessione; i pulsanti nella home dell'amministrazione arrivano con il pacchetto Cloudflare Cache Purge. Un purge fallito non blocca mai un salvataggio."

PLG_CONTENT_CFPURGE_FIELDSET_OTHER="Altre modifiche al sito pubblico"
PLG_CONTENT_CFPURGE_FIELD_ON_OTHER_DESC="Salvataggio, cambio di stato e cancellazione. Svuotano sempre tutta la cache, perché possono cambiare qualsiasi pagina."
PLG_CONTENT_CFPURGE_FIELD_ON_CATEGORY_LABEL="Categorie"

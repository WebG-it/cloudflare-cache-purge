PLG_CONTENT_CFPURGE_FIELDSET_ACCESS="Chi può svuotare"

PLG_CONTENT_CFPURGE_SETUP_NOTE_LABEL="Configurazione in 4 passi"
PLG_CONTENT_CFPURGE_SETUP_NOTE_DESC="<ol><li><strong>Zone ID.</strong> Nella <a href='https://dash.cloudflare.com' target='_blank' rel='noopener noreferrer'>dashboard di Cloudflare</a> apri il tuo dominio, scheda <em>Panoramica</em> (<em>Overview</em>), colonna di destra, sezione <em>API</em>: copia lo <em>Zone ID</em> (32 caratteri).</li><li><strong>API token.</strong> Apri <a href='https://dash.cloudflare.com/profile/api-tokens' target='_blank' rel='noopener noreferrer'>Il mio profilo &gt; Token API</a>, <em>Crea token</em>, <em>Crea token personalizzato</em>. Permessi (nella pagina di Cloudflare si scelgono con questi nomi): <strong>Zone &gt; Cache Purge &gt; Purge</strong> (obbligatorio). Facoltativo: <strong>Zone &gt; Zone &gt; Read</strong>, così il plugin può trovare e controllare da solo lo Zone ID. Risorse della zona (Zone Resources): <em>Include &gt; Specific zone</em> &gt; questo dominio. Cloudflare mostra il token una sola volta: copialo.</li><li><strong>Incolla i due valori</strong> nei campi qui sotto.</li><li><strong>Clicca Verifica connessione.</strong> Il plugin controlla token, zona e permesso con una prova innocua e ti dice in chiaro cosa non va. Quando è tutto verde, <strong>Salva</strong>: il semaforo nella home di Joomla diventa verde e i suoi pulsanti funzionano.</li></ol>"
PLG_CONTENT_CFPURGE_FIELD_ZONE_ID_LABEL="Cloudflare Zone ID"
PLG_CONTENT_CFPURGE_FIELD_ZONE_ID_DESC="Dashboard di Cloudflare, scegli il dominio, Panoramica, sezione API, Zone ID. Lascialo vuoto e clicca Verifica connessione per farlo trovare al plugin (serve il permesso facoltativo Zone Read)."
PLG_CONTENT_CFPURGE_FIELD_API_TOKEN_LABEL="Cloudflare API Token"
PLG_CONTENT_CFPURGE_FIELD_API_TOKEN_DESC="Token con il permesso Zone > Cache Purge > Purge, limitato alla tua zona."
PLG_CONTENT_CFPURGE_FIELD_VERIFY_LABEL="Connessione"
PLG_CONTENT_CFPURGE_VERIFY_BUTTON="Verifica connessione"
PLG_CONTENT_CFPURGE_USE_ZONE_BUTTON="Usa lo Zone ID trovato per questo sito"
PLG_CONTENT_CFPURGE_VERIFY_HINT="La verifica usa i valori scritti qui sopra, anche prima di salvare. Invia un purge innocuo per un indirizzo che non esiste, per dimostrare che il token può svuotare questa zona."
PLG_CONTENT_CFPURGE_STATE_UNCONFIGURED="Non ancora configurato: inserisci Zone ID e API token, poi clicca Verifica connessione."
PLG_CONTENT_CFPURGE_STATE_UNVERIFIED="Configurato ma non verificato: clicca Verifica connessione. I pulsanti della home restano spenti finché la connessione non è verificata."

PLG_CONTENT_CFPURGE_FIELD_ON_JOOMLA_CACHE_LABEL="Svuota anche Cloudflare quando svuoto la cache di Joomla"
PLG_CONTENT_CFPURGE_FIELD_ON_JOOMLA_CACHE_DESC="Sistema > Svuota cache, pulsanti Elimina ed Elimina tutto (non Elimina scaduti) svuotano anche tutta la cache di Cloudflare. Spento per impostazione predefinita."

PLG_CONTENT_CFPURGE_FIELD_ALLOWED_GROUPS_LABEL="Gruppi di utenti che possono usare i pulsanti della home"
PLG_CONTENT_CFPURGE_FIELD_ALLOWED_GROUPS_DESC="Chi vede il riquadro Cloudflare nella home dell'amministrazione e può svuotare la cache da lì. I Super Utenti possono sempre. Vuoto significa Amministratore e Super Utenti. Il purge automatico non dipende da questa scelta."


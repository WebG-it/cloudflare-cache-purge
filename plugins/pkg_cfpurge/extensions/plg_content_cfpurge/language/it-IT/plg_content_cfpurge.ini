PLG_CONTENT_CFPURGE_FIELD_PURGE_MODE_LABEL="Cosa svuotare"
PLG_CONTENT_CFPURGE_FIELD_PURGE_MODE_DESC="Tutta la cache: la scelta più sicura, ogni modifica svuota tutto (predefinito). Solo gli indirizzi cambiati: per un articolo svuota la sua pagina, le pagine delle sue categorie e la home, più gli indirizzi fissi qui sotto; più leggero per i visitatori, ma gli elenchi che mostrano l'articolo altrove (moduli laterali, ricerca, pagine successive, tag) possono restare vecchi finché Cloudflare non li fa scadere. Se gli indirizzi non si riescono a calcolare, o per una modifica che non è un articolo, viene svuotata tutta la cache."
PLG_CONTENT_CFPURGE_MODE_ALL="Tutta la cache"
PLG_CONTENT_CFPURGE_MODE_TARGETED="Solo gli indirizzi cambiati"
PLG_CONTENT_CFPURGE_FIELD_EXTRA_URLS_LABEL="Indirizzi fissi aggiuntivi"
PLG_CONTENT_CFPURGE_FIELD_EXTRA_URLS_DESC="Uno per riga, svuotati sempre insieme a un articolo, per esempio /sitemap.xml o /feed. Un percorso viene completato con il dominio di questo sito; un indirizzo di un altro dominio viene ignorato."

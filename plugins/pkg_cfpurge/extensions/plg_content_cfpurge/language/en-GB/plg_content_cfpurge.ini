PLG_CONTENT_CFPURGE_SETUP_NOTE_LABEL="Set up in 4 steps"
PLG_CONTENT_CFPURGE_SETUP_NOTE_DESC="<ol><li><strong>Zone ID.</strong> In the <a href='https://dash.cloudflare.com' target='_blank' rel='noopener noreferrer'>Cloudflare dashboard</a> open your domain, tab <em>Overview</em>, right column, section <em>API</em>: copy the <em>Zone ID</em> (32 characters).</li><li><strong>API token.</strong> Open <a href='https://dash.cloudflare.com/profile/api-tokens' target='_blank' rel='noopener noreferrer'>My Profile &gt; API Tokens</a>, <em>Create Token</em>, <em>Create Custom Token</em>. Permissions: <strong>Zone &gt; Cache Purge &gt; Purge</strong> (required). Optional: <strong>Zone &gt; Zone &gt; Read</strong>, so the plugin can find and check the Zone ID by itself. Zone Resources: <em>Include &gt; Specific zone</em> &gt; this domain. Cloudflare shows the token only once: copy it.</li><li><strong>Paste both</strong> in the two fields below.</li><li><strong>Click Verify connection.</strong> The plugin checks the token, the zone and the permission with a harmless test, and tells you in plain words what is wrong. When all is green, <strong>Save</strong>: the traffic light in the Joomla dashboard turns green and its buttons work.</li></ol>"
PLG_CONTENT_CFPURGE_FIELD_ZONE_ID_LABEL="Cloudflare Zone ID"
PLG_CONTENT_CFPURGE_FIELD_ZONE_ID_DESC="Cloudflare dashboard, select your domain, Overview, API section, Zone ID. Leave it empty and click Verify connection to have it found for you (needs the optional Zone Read permission)."
PLG_CONTENT_CFPURGE_FIELD_API_TOKEN_LABEL="Cloudflare API Token"
PLG_CONTENT_CFPURGE_FIELD_API_TOKEN_DESC="Token with only the permission Zone - Cache Purge - Purge, limited to the single zone of this site. It is stored in the database like every plugin parameter, and never shown again."

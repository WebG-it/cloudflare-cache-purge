PLG_CONTENT_CFPURGE_FIELD_PURGE_MODE_LABEL="What to clear"
PLG_CONTENT_CFPURGE_FIELD_PURGE_MODE_DESC="Whole cache: safest, every change clears everything (default). Changed addresses only: for an article it clears its page, its category pages and the home page, plus the fixed addresses below; faster for the visitors, but lists that show the article elsewhere (side modules, search, pagination, tags) can stay old until Cloudflare expires them. If the addresses cannot be worked out, or for any change that is not an article, the whole cache is cleared."
PLG_CONTENT_CFPURGE_MODE_ALL="The whole cache"
PLG_CONTENT_CFPURGE_MODE_TARGETED="Only the changed addresses"
PLG_CONTENT_CFPURGE_FIELD_EXTRA_URLS_LABEL="Fixed extra addresses"
PLG_CONTENT_CFPURGE_FIELD_EXTRA_URLS_DESC="One per line, always cleared together with an article, for example /sitemap.xml or /feed. A path is completed with the domain of this site; an address of another domain is ignored."

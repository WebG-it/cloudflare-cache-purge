PLG_CONTENT_CFPURGE="Content - Cloudflare Cache Purge"
PLG_CONTENT_CFPURGE_XML_DESCRIPTION="Clears the Cloudflare cache when the public site changes: articles, categories, menu items, modules, custom fields and tags (optionally also System > Clear Cache). Whole cache or only the changed addresses. Includes a guided setup with a connection check; the dashboard buttons come with the Cloudflare Cache Purge package. A failed purge never blocks a save."

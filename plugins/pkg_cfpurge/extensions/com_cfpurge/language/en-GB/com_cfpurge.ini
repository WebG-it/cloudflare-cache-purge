COM_CFPURGE="Cloudflare Cache Purge"
COM_CFPURGE_ACTION_STATUS="Read the state (API)"
COM_CFPURGE_ACTION_STATUS_DESC="Allows reading, through the Web Services API, whether Cloudflare Cache Purge is set up and the outcome of the last purge. Never shows the Cloudflare token."
COM_CFPURGE_ACTION_PURGE="Clear the Cloudflare cache (API)"
COM_CFPURGE_ACTION_PURGE_DESC="Allows clearing the whole Cloudflare cache, or some addresses, through the Web Services API with the Joomla API token of the user. Super Users always can."
COM_CFPURGE_API_URLS_REQUIRED="Send a JSON body with a list of addresses: {&quot;urls&quot;: [&quot;https://...&quot;]}."
COM_CFPURGE_API_NOT_AVAILABLE="Cloudflare Cache Purge is not installed or its plugin is switched off."

PLG_WEBSERVICES_CFPURGE="Web Services - Cloudflare Cache Purge"
PLG_WEBSERVICES_CFPURGE_XML_DESCRIPTION="Part of the Cloudflare Cache Purge package. Adds three routes to the Joomla Web Services API: GET v1/cfpurge/status, POST v1/cfpurge/all and POST v1/cfpurge/urls, so that a program can clear the Cloudflare cache with the Joomla API token of a user. Who may use them is set in the Options (permissions) of the component Cloudflare Cache Purge. Switch this plugin off to close the API."

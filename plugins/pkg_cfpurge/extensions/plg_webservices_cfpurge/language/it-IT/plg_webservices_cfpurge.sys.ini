PLG_WEBSERVICES_CFPURGE="Web Services - Cloudflare Cache Purge"
PLG_WEBSERVICES_CFPURGE_XML_DESCRIPTION="Parte del pacchetto Cloudflare Cache Purge. Aggiunge tre percorsi alle API Web Services di Joomla: GET v1/cfpurge/status, POST v1/cfpurge/all e POST v1/cfpurge/urls, così un programma può svuotare la cache di Cloudflare con il token API Joomla di un utente. Chi può usarli si imposta nelle Opzioni (permessi) del componente Cloudflare Cache Purge. Spegni questo plugin per chiudere l'API."

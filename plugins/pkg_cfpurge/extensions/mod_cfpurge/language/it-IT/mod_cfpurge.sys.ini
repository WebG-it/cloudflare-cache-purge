MOD_CFPURGE="Cloudflare Cache Purge"
MOD_CFPURGE_XML_DESCRIPTION="Riquadro per la home dell'amministrazione: semaforo della connessione a Cloudflare, un pulsante per svuotare tutta la cache, un campo per svuotare uno o più indirizzi e l'esito dell'ultimo purge. Fa parte del pacchetto Cloudflare Cache Purge; lo vedono solo gli utenti ammessi nelle opzioni del plugin Contenuto - Cloudflare Cache Purge."

PKG_CFPURGE="Cloudflare Cache Purge"
PKG_CFPURGE_XML_DESCRIPTION="Clears the Cloudflare cache when your Joomla site changes, and adds a box to the administrator home page to clear it by hand: the whole cache or one or more addresses. Guided setup with a connection check. Also answers the Joomla Web Services API, so that a program can clear the cache with the Joomla API token of a user you allow (permissions in the Options of the component Cloudflare Cache Purge). Contains the plugins Content, System and Web Services - Cloudflare Cache Purge, the administrator module and the API component."
PKG_CFPURGE_POSTINSTALL_NEW="Cloudflare Cache Purge is installed. Open System > Plugins > Content - Cloudflare Cache Purge, follow the 4 steps (Zone ID, API token, paste, Verify connection) and save. The box on the administrator home page shows the state."
PKG_CFPURGE_POSTINSTALL_UPGRADE="Cloudflare Cache Purge 2 is installed over the previous version: Zone ID, token and switches are kept. New: a box on the administrator home page. Open System > Plugins > Content - Cloudflare Cache Purge and click Verify connection once, so the buttons of the box are enabled."

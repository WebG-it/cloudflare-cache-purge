PKG_CFPURGE="Cloudflare Cache Purge"
PKG_CFPURGE_XML_DESCRIPTION="Svuota la cache di Cloudflare quando il tuo sito Joomla cambia, e aggiunge nella home dell'amministrazione un riquadro per svuotarla a mano: tutta la cache oppure uno o più indirizzi. Configurazione guidata con verifica della connessione. Contiene i plugin Contenuto - Cloudflare Cache Purge e Sistema - Cloudflare Cache Purge e il modulo di amministrazione Cloudflare Cache Purge."
PKG_CFPURGE_POSTINSTALL_NEW="Cloudflare Cache Purge è installato. Apri Sistema > Plugin > Contenuto - Cloudflare Cache Purge, segui i 4 passi (Zone ID, API token, incolla, Verifica connessione) e salva. Il riquadro nella home dell'amministrazione mostra lo stato."
PKG_CFPURGE_POSTINSTALL_UPGRADE="Cloudflare Cache Purge 2 è installato sopra la versione precedente: Zone ID, token e interruttori sono rimasti. Novità: un riquadro nella home dell'amministrazione. Apri Sistema > Plugin > Contenuto - Cloudflare Cache Purge e clicca una volta Verifica connessione, così i pulsanti del riquadro si abilitano."

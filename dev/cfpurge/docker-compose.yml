# Local test environment for the Cloudflare Cache Purge package (pkg_cfpurge):
# Joomla 6.2 (or 5.4, see JOOMLA_ZIP) + PHP 8.4 + MariaDB 11.4, plus a FAKE Cloudflare API.
# Only for local development on localhost. Passwords come from .env (not versioned,
# copy .env.example and choose your own values). No real Cloudflare token is ever used:
# the web container resolves api.cloudflare.com to itself and answers with scripts/mock_cf.
name: cfpurge-dev

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?set DEV_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?set DEV_DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    # Official image used only for its PHP 8.4 + Apache runtime; Joomla (6.2.0 by
    # default, JOOMLA_ZIP for another release) is extracted by scripts/entrypoint.sh.
    image: joomla:6.1-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/dev-scripts/entrypoint.sh"]
    # The fake Cloudflare API answers on the same container (HTTPS, see scripts/mock_cf_setup.sh).
    extra_hosts:
      - "api.cloudflare.com:127.0.0.1"
    environment:
      DEV_SITE_URL: http://www.cfdemo.localhost:${DEV_PORT:-8790}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?set DEV_DB_PASSWORD in .env}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?set DEV_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DEV_PORT:-8790}:80"
    volumes:
      - site:/var/www/html
      - ./scripts:/dev-scripts:ro
      - ./mock:/dev-mock:ro
      - ${JOOMLA_ZIP:-./.cache/joomla-6.2.0.zip}:/joomla.zip:ro
      - ../../build/out:/dist:ro
      - ../../dist:/dist-released:ro
      - ./.cache/updates:/updates:ro

volumes:
  db:
  site:
